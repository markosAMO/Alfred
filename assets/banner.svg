  <rect width="1040" height="300" fill="url(#bg)"/>


  <rect width="1040" height="3" fill="url(#rule)"/>

  <use href="#bowtie" transform="translate(0,2)"/>

  <rect x="222" y="86" width="2" height="130" fill="#D4AF37" opacity="0.45"/>

  <text x="260" y="142" font-family="Georgia, 'Times New Roman', 'Liberation Serif', serif" font-size="82" letter-spacing="2" fill="#F0F6FC">Alfred</text>

  <text x="263" y="182" font-family="-apple-system, 'Segoe UI', Roboto, 'Liberation Sans', sans-serif" font-size="24" fill="#8B949E">A spec-driven workflow for building software with AI agents</text>

  <text x="263" y="228" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="18" fill="#6E7681">refine<tspan fill="#D4AF37"> · </tspan>spec<tspan fill="#D4AF37"> · </tspan>design<tspan fill="#D4AF37"> · </tspan>tasks<tspan fill="#D4AF37"> · </tspan>apply<tspan fill="#D4AF37"> · </tspan>verify<tspan fill="#D4AF37"> · </tspan>review<tspan fill="#D4AF37"> · </tspan>archive</text>
