<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-label="Alfred - a spec-driven workflow for building software with AI agents">
  <title>Alfred</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#111823"/>
      <stop offset="1" stop-color="#0D1420"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="0.70" stop-color="#E8C76B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="1" y2="1">
